name: 거시경제 페이지 업데이트

on:
  schedule:
    # 3시간마다 (한국 시간 8, 11, 14, 17, 20, 23, 2, 5시)
    - cron: "0 2-23/3 * * *"
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: update-page        # 두 번이 겹쳐 돌지 않게

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 지표와 기사로 페이지 만들기
        env:
          BOK_API_KEY: ${{ secrets.BOK_API_KEY }}   # 없어도 동작해요
        run: python main.py

      - name: 결과 저장하기
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add index.html news.json
          git commit -m "페이지 업데이트" || echo "변경 없음"
          git push
